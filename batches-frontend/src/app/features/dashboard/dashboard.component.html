<div class="app-layout" [class.sidebar-collapsed]="sidebarCollapsed">

  <!-- ── Navbar ── -->
  <header class="navbar">
    <div class="navbar-left">
      <button class="sidebar-toggle" (click)="toggleSidebar()">
        <i class="pi pi-bars"></i>
      </button>
      <span class="app-title">BATCHES</span>
      <span class="app-subtitle">Télé-compensation BNA</span>
    </div>
    <div class="navbar-right">
      <span class="user-info">
        <i class="pi pi-user"></i>
        <span class="user-name">{{ user()?.prenom }} {{ user()?.nom }}</span>
      </span>
      <button class="logout-btn" (click)="logout()">
        <i class="pi pi-sign-out"></i>
        <span>Déconnexion</span>
      </button>
    </div>
  </header>

  <!-- ── Sidebar ── -->
  <aside class="sidebar">
    <nav class="sidebar-nav">
      <ul>
        <li class="nav-item">
          <a routerLink="home" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}">
            <i class="pi pi-home"></i>
            <span class="nav-label">Tableau de bord</span>
          </a>
        </li>
        <li class="nav-divider"><span class="nav-label">Compensation</span></li>
        <li class="nav-item">
          <a routerLink="batch-launcher" routerLinkActive="active">
            <i class="pi pi-play-circle"></i>
            <span class="nav-label">Lancement Batch</span>
          </a>
        </li>
        <li class="nav-item">
          <a routerLink="consultation" routerLinkActive="active">
            <i class="pi pi-search"></i>
            <span class="nav-label">Consultation</span>
          </a>
        </li>
        <li class="nav-divider"><span class="nav-label">Administration</span></li>
        <li class="nav-item">
          <a routerLink="audit" routerLinkActive="active">
            <i class="pi pi-list"></i>
            <span class="nav-label">Journal d'audit</span>
          </a>
        </li>
      </ul>
    </nav>
    <div class="sidebar-footer">
      <span class="nav-label">v2.0 — Refonte 2026</span>
    </div>
  </aside>

  <!-- ── Main Content (child routes render here) ── -->
  <main class="main-content">
    <router-outlet></router-outlet>
  </main>

</div>
