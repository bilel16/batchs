<div class="profile-badge" cdkDrag [cdkDragDisabled]="isProfileRevoked" (mousedown)="onDragAttempt($event)"
  (mouseenter)="onMouseEnter()" (mouseleave)="onMouseLeave()" #revokedTooltip
  pTooltip="Ce profil est révoqué, il ne peut pas être déplacé, il faut l'activer d'abord" tooltipEvent="manual"
  [class.shake]="triggerShake" [class]="listType" [class.selected]="isSelected" [class.newly-moved]="isNewlyMoved"
  [class.dragging-multiple]="isDraggingMultiple" [class.revoked]="isProfileRevoked" [class.restoring]="isRestoring"
  (click)="onProfileClick()">

  <!-- Action Icon Column -->
  <div class="action-icon-column">
    <i *ngIf="listType === 'available'" class="pi pi-plus-circle badge-icon clickable"
      (click)="onActionClick('add', $event)" title="Ajouter aux profils assignés">
    </i> <i *ngIf="listType === 'assigned' && !isProfileRevoked" class="pi pi-minus-circle badge-icon clickable"
      (click)="onActionClick('remove', $event)" title="Retirer des profils assignés">
    </i>
    <i *ngIf="listType === 'assigned' && isProfileRevoked" class="pi pi-ban badge-icon revoked-icon"
      title="Profil révoqué - Ce profil est assigné mais inactif">
    </i>

    <!-- Level indicator -->
    <div class="level-indicator" [class]="'level-' + (profile.codNivhPfl || '1')"
      [title]="'Niveau: ' + (profile.codNivhPfl || '1')">
      {{ profile.codNivhPfl || '1' }}
    </div>
  </div>

  <!-- Main Content -->
  <div class="badge-content">
    <div class="profile-header">
      <span class="profile-code">{{ profile.displayName }}</span>
      <div class="profile-metadata">
        <!-- Profile Info Button for selected cards -->
        <button class="profile-info-button" (click)="onProfileInfo($event)" title="Voir les détails du profil">
          <i class="pi pi-info-circle"></i>
        </button>
      </div>
    </div>
    <span class="profile-label">{{ profile.codPflPfl }}</span>
  </div>
  <!-- Status Indicators -->
  <div class="status-indicators">
    <i *ngIf="isNewlyMoved" class="pi pi-clock pending-icon" title="Modification en attente">
    </i>
  </div>
  <!-- Revoked Profile Overlay -->
  <div *ngIf="isProfileRevoked" class="revoked-overlay" [class.show-restore]="showRestoreAction">
    <div class="revoked-content">
      <i class="pi pi-exclamation-triangle revoked-icon"></i>
      <span class="revoked-label">{{ revokedStatusMessage }}</span>
    </div>

    <!-- Restore Action Button (appears on hover) -->
    <button *ngIf="showRestoreAction" class="restore-button" (click)="onRestoreClick($event)" [disabled]="isRestoring"
      pTooltip="Cliquez pour réactiver ce profil" tooltipPosition="top">
      <i class="pi" [ngClass]="isRestoring ? 'pi-spin pi-spinner' : 'pi-refresh'"></i>
      <span>{{ isRestoring ? 'Activation...' : 'Activer' }}</span>
    </button>
  </div>

  <!-- Custom drag preview -->
  <div *cdkDragPreview class="drag-preview">
    <div class="drag-preview-content">
      <i class="pi pi-users drag-preview-icon"></i>
      <span class="drag-preview-text">{{ getDragPreviewText() }}</span>
      <div *ngIf="isDraggingMultiple" class="drag-preview-count">
        {{ selectedCount }}
      </div>
    </div>
  </div>
</div>
