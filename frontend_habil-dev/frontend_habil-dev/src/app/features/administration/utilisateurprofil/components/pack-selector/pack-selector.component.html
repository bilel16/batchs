<!-- 
  @fileoverview Pack Selector Component Template
  Pack Assignment Hub with Marketplace Design
-->

<div class="pack-assignment-hub">
    <!-- Shopping Cart Section (Top) -->
    <app-pack-cart [cartPacks]="cartPacks" [selectedUser]="selectedUser" [isAssigning]="isAssigning"
        (assignAll)="onAssignAllFromCart()" (removeFromCart)="onRemoveFromCart($event)" (clearCart)="onClearCart()"
        (cartPackClick)="onPackClick($event)">
    </app-pack-cart>

    <!-- Marketplace Catalog Section (Bottom) -->
    <div class="pack-marketplace">
        <div class="header">
            <!-- Filter Section -->
            <div class="filter-section">
                <div class="filter-bar">
                    <!-- Search -->
                     <div class="search-bar">
                    <span class="p-input-icon-left ">
                        <i [style]="{position:'absolute' ,margin:'12px'}" class="pi pi-search"></i>
                        <input type="text" pInputText [(ngModel)]="searchTerm" (ngModelChange)="onSearchChange()"
                            placeholder="Rechercher un pack..." class="search-input">
                    </span>
                    </div>
                    <!-- Category Filter -->
                    <p-dropdown [(ngModel)]="selectedCategory" [options]="categoryOptions"
                        (ngModelChange)="onCategoryChange()" placeholder="Catégorie" [showClear]="true"
                        styleClass="category-dropdown">
                    </p-dropdown>

                    <!-- Status Toggle -->
                    <p-selectButton [(ngModel)]="showActiveOnly" [options]="[
          {label: 'Tous', value: false},
          {label: 'Actifs', value: true}
        ]" (ngModelChange)="onStatusToggle()" optionLabel="label" optionValue="value">
                    </p-selectButton>

                    <!-- Clear Filters -->
                    <button pButton pRipple type="button" icon="pi pi-filter-slash" label="Effacer"
                        class="p-button-outlined p-button-secondary" (click)="clearFilters()">
                    </button>
                </div> <!-- Stats -->
                <div class="pack-stats-bar">
                    <span class="stat-badge available">
                        <i class="pi pi-box"></i>
                        {{ filteredAvailablePacks.length }} packs disponibles
                    </span>
                    <span class="stat-badge cart" *ngIf="cartPacks.length > 0">
                        <i class="pi pi-shopping-cart"></i>
                        {{ cartPacks.length }} dans le panier
                    </span>
                    <span class="stat-badge assigned">
                        <i class="pi pi-check-circle"></i>
                        {{ filteredAssignedPacks.length }} packs assignés
                    </span>
                </div>
            </div>
        </div>


        <!-- Pack Grid Catalog -->
        <div class="pack-catalog">

            <!-- Available Packs Grid -->
            <div class="pack-grid" *ngIf="!loading">
                <app-pack-card *ngFor="let pack of filteredAvailablePacks; trackBy: trackByPackId" [pack]="pack"
                    [isSelected]="isPackInCart(pack)" [isAssigned]="false" [mode]="'marketplace'"
                    (packClick)="onPackClick(pack)" (assignClick)="onAddToCart(pack)" (infoClick)="onInfoClick(pack)"
                    class="marketplace-pack-card">
                </app-pack-card>

                <!-- Empty State -->
                <div *ngIf="filteredAvailablePacks.length === 0" class="empty-state">
                    <i class="pi pi-inbox"></i>
                    <p>Aucun pack disponible</p>
                    <small *ngIf="searchTerm || selectedCategory">Essayez de modifier vos filtres</small>
                </div>
            </div>

            <!-- Loading State -->
            <div *ngIf="loading" class="loading-state">
                <p-progressSpinner styleClass="w-4rem h-4rem"></p-progressSpinner>
                <p>Chargement des packs...</p>
            </div>
        </div>

        <!-- Assigned Packs Section (Collapsible) -->
        <div class="assigned-packs-section" *ngIf="filteredAssignedPacks.length > 0">
            <div class="assigned-header" (click)="toggleAssignedSection()">
                <h4 class="assigned-title">
                    <i class="pi pi-check-circle text-success me-2"></i>
                    Packs Déjà Assignés ({{ filteredAssignedPacks.length }})
                </h4>
                <button pButton pRipple type="button"
                    [icon]="showAssignedPacks ? 'pi pi-chevron-up' : 'pi pi-chevron-down'"
                    class="p-button-text p-button-rounded p-button-sm">
                </button>
            </div>

            <div class="assigned-packs-grid" *ngIf="showAssignedPacks">
                <app-pack-card *ngFor="let pack of filteredAssignedPacks; trackBy: trackByPackId" [pack]="pack"
                    [isSelected]="isPackSelected(pack)" [isAssigned]="true" (packClick)="onPackClick(pack)"
                    (unassignClick)="onUnassignClick(pack)" (infoClick)="onInfoClick(pack)" class="assigned-pack-card">
                </app-pack-card>
            </div>
        </div>
    </div>
