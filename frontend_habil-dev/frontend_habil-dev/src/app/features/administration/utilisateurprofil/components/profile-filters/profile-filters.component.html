<div class="container">

  <!-- Toggle Bar -->
  <app-tab-toggle [tabs]="['Profils disponibles', 'Profils assignés']" [selectedIndex]="selectedTabIndex"
    (tabChange)="onTabChanged($event)" class="box1"></app-tab-toggle>
  <!-- Profile Filters -->
  <div class="profile-filters box2">
    <!-- Search Filter -->
    <div class="filter-group">
      <div class="search-input-container">
        <i class="pi pi-search"></i>
        <div class="floating-label">
          <input type="text" id="profileSearch" [(ngModel)]="profileFilters.searchTerm" (input)="onFilterChange()"
            placeholder=" " required class="profile-search-input">
          <label for="profileSearch">Rechercher profils</label>
        </div>
      </div>
    </div>

    <!-- Level Filter -->
    <div class="filter-group">
      <p-dropdown [options]="levelFilterOptions" [(ngModel)]="profileFilters.selectedLevel" placeholder="Niveau"
        [showClear]="true" (onChange)="onFilterChange()" styleClass="level-filter-dropdown">
      </p-dropdown>
    </div>

    <!-- Category Filter -->
    <div class="filter-group">
      <p-dropdown [options]="categoryFilterOptions" [(ngModel)]="profileFilters.selectedCategory"
        placeholder="Structure" [showClear]="true" (onChange)="onFilterChange()" styleClass="category-filter-dropdown">
      </p-dropdown>
    </div>

    <!-- Status Filter -->
    <div class="filter-group">
      <p-dropdown [options]="statusFilterOptions" [(ngModel)]="profileFilters.selectedStatus" placeholder="Statut"
        [showClear]="true" (onChange)="onFilterChange()" styleClass="status-filter-dropdown">
      </p-dropdown>
    </div>

    <!-- Clear All Filters Button -->
    <div class="filter-actions">
      <button pButton pRipple icon="pi pi-filter-slash" class="p-button-text p-button-sm clear-filters-btn"
        (click)="onClearAllFilters()" [disabled]="!hasActiveFilters()" title="Effacer tous les filtres">
      </button>
    </div>
  </div>

</div>
